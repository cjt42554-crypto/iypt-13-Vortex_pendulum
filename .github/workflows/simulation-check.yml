name: Scientific core checks

on:
  push:
    paths: ['02_模拟程序/**', '01_最终理论/**', 'tools/check_markdown_math.py', '.github/workflows/simulation-check.yml']
  pull_request:
    paths: ['02_模拟程序/**', '01_最终理论/**', 'tools/check_markdown_math.py', '.github/workflows/simulation-check.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scientific-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formal-program:
    name: Complete formal program validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 02_模拟程序
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: 02_模拟程序/package-lock.json
      - name: Install formal program dependencies
        run: npm ci
      - name: Run the complete formal validation gate
        run: npm run validate
