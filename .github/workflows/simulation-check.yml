name: Scientific core checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  formal-program:
    name: Complete formal program validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 02_模拟程序
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: 02_模拟程序/package-lock.json
      - name: Install formal program dependencies
        run: npm ci
      - name: Run the complete formal validation gate
        run: npm run validate
