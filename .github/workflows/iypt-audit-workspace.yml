name: Apply and validate numerical audit fixes
on:
  push:
    branches: [main]
    paths: [.github/workflows/iypt-audit-workspace.yml, .github/iypt-audit.patch.xz]
permissions:
  contents: write
jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 02_模拟程序/package-lock.json
      - name: Apply reviewed patch
        run: |
          python3 - <<'PY'
          import hashlib, lzma, pathlib, subprocess
          raw = lzma.decompress(pathlib.Path('.github/iypt-audit.patch.xz').read_bytes())
          assert hashlib.sha256(raw).hexdigest() == 'a11a1a08a0e20f63b9e4d6101e74f6c2b22cf8938f3c7c03fe02da86f50a0d7c'
          pathlib.Path('/tmp/audit.patch').write_bytes(raw)
          subprocess.run(['git', 'apply', '--check', '/tmp/audit.patch'], check=True)
          subprocess.run(['git', 'apply', '/tmp/audit.patch'], check=True)
          pathlib.Path('90_候选工作区/交接说明_history.md').write_bytes(b'')
          test = pathlib.Path('02_模拟程序/tests/forward-solver.test.ts')
          source = test.read_text()
          old = '    expect(deriveParameters(make(0.0005)).effectiveMomentOfInertia).toBeGreaterThan(0);\n  });'
          new = '    expect(deriveParameters(make(0.0005)).effectiveMomentOfInertia).toBeGreaterThan(0);\n  }, 30_000); // Actual step halving plus within-step guards exceeds the default 5 s on CI.'
          assert source.count(old) == 1
          test.write_text(source.replace(old, new))
          handoff = pathlib.Path('90_候选工作区/交接说明_current.md')
          source = handoff.read_text()
          source = source.replace('## 本轮提交验证记录', '完整验证首轮 85 项通过，能量细化测试触发默认 5 秒超时。仅将该测试超时设为 30 秒，保留计算时长、真实步长减半和全部数值断言；步内检查有额外求值开销，未宣称整体加速。\n\n## 本轮提交验证记录')
          handoff.write_text(source)
          PY
      - name: Full formal validation
        working-directory: 02_模拟程序
        run: |
          set -o pipefail
          { node --version; npm ci && npm run validate; } 2>&1 | tee /tmp/iypt-audit-validation.log
      - name: Publish validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-validation
          path: /tmp/iypt-audit-validation.log
          retention-days: 14
      - name: Record results and commit tested source
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          root = pathlib.Path('90_候选工作区')
          log = re.sub(r'\x1b\[[0-9;]*m', '', pathlib.Path('/tmp/iypt-audit-validation.log').read_text())
          dest = root / 'current/2026-09-05_数值审查修复/validation.log'
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_text(log)
          summary = '\n'.join(line for line in log.splitlines() if re.search(r'Test Files|Tests |DOCS PASS|E2E PASS|DESKTOP|✓ built', line))
          with (root / '交接说明_current.md').open('a') as f:
              f.write('\n实际远端验证：`npm ci && npm run validate`，退出码 `0`。包含 Vitest、TypeScript/Vite 构建、桌面入口检查、浏览器端到端测试与文档检查。\n\n')
              f.write('工作流运行编号：`' + os.environ['GITHUB_RUN_ID'] + '`；测试对象是基于 `' + os.environ['GITHUB_SHA'] + '` 应用本轮补丁后的工作树。\n\n```text\n' + summary + '\n```\n')
          assert (root / '交接说明_history.md').stat().st_size == 0
          pathlib.Path('.github/iypt-audit.patch.xz').unlink()
          pathlib.Path('.github/workflows/iypt-audit-workspace.yml').unlink()
          PY
          git diff --check
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: enforce joint calibration support and resolve within-step events; refresh handoff'
          git push origin HEAD:main
          git rev-parse HEAD
