name: Execute reviewed theory patch
on:
  push:
    branches: [main]
    paths: [.github/workflows/theory-revision-execute.yml]
permissions:
  contents: write
jobs:
  revise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract and apply the reviewed Python patch
        shell: bash
        run: |
          python3 - <<'PY'
          import ast, subprocess
          from pathlib import Path
          raw=Path('.github/workflows/theory-revision-20260905.yml').read_text()
          script=raw.split("          python3 - <<'PY'\n",1)[1].split('\n          PY\n      - name:',1)[0]
          script='\n'.join(line[10:] if line.startswith(' '*10) else line for line in script.splitlines())+'\n'
          script=script.replace(r".replace('\n          ', '\n')", '')
          script=script.replace("old = '$u_", "old = r'$u_")
          ast.parse(script)
          Path('/tmp/apply-theory.py').write_text(script)
          subprocess.run(['python3','/tmp/apply-theory.py'],check=True)
          p=Path('01_最终理论/01-前向预测理论.md')
          p.write_text('\n'.join(line.rstrip() if line.startswith('> 理论修订：') else line for line in p.read_text().splitlines())+'\n')
          PY
      - name: Validate theory and documentation
        shell: bash
        run: |
          set -euo pipefail
          evidence='90_候选工作区/current/2026-09-05_前向理论修订'
          {
            python3 --version
            python3 "$evidence/check_theory.py"
            (cd '02_模拟程序' && bash scripts/check-docs.sh)
            git diff --check
          } 2>&1 | tee "$evidence/validation.txt"
      - name: Commit and push verified changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('90_候选工作区/交接说明_current.md')
          p.write_text(p.read_text()+'\n## 本轮实际提交前验证\n\n代数回归 8 项通过；原有文档检查通过；git diff --check 通过。工作流运行编号：`'+os.environ['GITHUB_RUN_ID']+'`。验证对象为本工作流检出的 main 加本轮修改后的工作树，完整日志随提交保留。\n')
          for f in ['theory-revision-20260905.yml','theory-revision-execute.yml']:
              Path('.github/workflows',f).unlink()
          assert Path('90_候选工作区/交接说明_history.md').stat().st_size==0
          PY
          git diff --check
          git diff --stat
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '01_最终理论/01-前向预测理论.md' '01_最终理论/04-实验辨识、标定与留出预测协议.md' '90_候选工作区/交接说明_current.md' '90_候选工作区/交接说明_history.md' '90_候选工作区/current/2026-09-05_前向理论修订'
          git add -u .github/workflows/theory-revision-20260905.yml .github/workflows/theory-revision-execute.yml
          git commit -m 'fix(theory): define wet-domain termination and propagate joint uncertainty'
          git push origin HEAD:main
          git rev-parse HEAD
