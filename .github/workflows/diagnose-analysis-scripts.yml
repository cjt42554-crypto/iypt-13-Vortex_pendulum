name: Diagnose analysis scripts

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 02_模拟程序/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reproduce failing analysis commands
        run: |
          set +e
          log="90_候选工作区/current/vortex-analysis-diagnostic.txt"
          mkdir -p "$(dirname "$log")"
          : > "$log"

          run_step() {
            label="$1"
            shift
            printf '\n===== %s =====\n$' "$label" >> "$log"
            printf ' %q' "$@" >> "$log"
            printf '\n' >> "$log"
            "$@" >> "$log" 2>&1
            status=$?
            printf '\nstatus=%s\n' "$status" >> "$log"
          }

          run_step npm_ci npm --prefix "02_模拟程序" ci
          run_step audit_high_fidelity npm --prefix "02_模拟程序" run audit:high-fidelity
          run_step analyze_high_fidelity_grid npm --prefix "02_模拟程序" run analyze:high-fidelity-grid
          run_step sweep_forward npm --prefix "02_模拟程序" run sweep:forward
          run_step analyze_structure npm --prefix "02_模拟程序" run analyze:structure
          run_step install_plot_dependencies python3 -m pip install numpy matplotlib
          run_step plot_structure npm --prefix "02_模拟程序" run plot:structure

          rm -rf "90_候选工作区/current/验证与复现"
          rm -f .github/workflows/diagnose-analysis-scripts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/diagnose-analysis-scripts.yml "$log"
          git commit -m "Record analysis script diagnostics"
          git push
