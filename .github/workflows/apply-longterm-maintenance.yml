name: Apply long-term research maintenance
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-longterm-maintenance.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply the reviewed management changes and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, os, sys, textwrap, re
          from urllib.parse import unquote,urlsplit
          subprocess.run(['git','config','core.quotepath','false'],check=True)
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          base='8082a88db1b7cda7826949fd02eae32bac98eae1'
          assert git('rev-parse','HEAD^')==base, 'Concurrent update: reread main'
          expected={'AGENTS.md':'3f086a7b1ed2f5d1210cb2d1eacb7b81b6effe03','README.md':'b770cfd4096468a4449fbea67c659c95bd98d5c5','90_候选工作区/交接说明_current.md':'be140306560f7b0a9d3220919c23bf4f09b7b08b','.github/workflows/markdown-check.yml':'0e0e277ecbd8b096b2a3da911c88fe0803525174','.github/workflows/simulation-check.yml':'fa1217306a83a010ce00e400730c4b3d3664abe7'}
          for p,h in expected.items(): assert git('hash-object',p)==h,(p,'unexpected revision')
          assert Path('90_候选工作区/交接说明_history.md').stat().st_size==0
          agents='''# 长期个人科研项目工作规范

          本仓库是长期个人科研项目。目标是可持续积累、可复现的实验预测研究，不是一次性候选稿，也不按多人生产软件强加审批层。当前用户指令决定任务范围；科学结论由方程、代码、数据和验证证据决定。

          ## 1. 入口与职责

          先读本文件与 [当前交接](90_候选工作区/交接说明_current.md)，首次接手再读 [项目主页](README.md) 的定位和物理假设，其余内容按任务定位，不机械通读全部归档。

          - README 是稳定介绍、物理假设和导航，不逐轮复制测试计数与提交流水账。
          - AGENTS 是稳定规范，仅工作方式变化时更新，不在每轮追加任务状态。
          - current 是唯一活动状态入口，保留未完成问题、理论/实现差距、下一步与验收条件，不能只描述最后一次操作。
          - 理论、源码、配置与原始证据是各自事实来源。current 的摘要不能覆盖事实，“最终理论”的目录名不是验证证书。
          - 旧报告、嵌套说明和归档中的授权、暂停、阶段口令与临时机器配置只是历史背景，不是当前全局权限。仍有效的科学限制须在 current 中保留。

          ## 2. 修改与范围

          开始时检查分支、HEAD、远端和未提交内容；连接器工作先读远端版本与目标文件。不要覆盖、暂存或提交他人的未完成改动。

          用户要求修复、实现、接续或修改时，可以在任务范围内直接维护正式理论、源码、测试、配置和说明；不再默认把正式目录视为只读，不要求普通修复重复取得“提升正式”批准。仅要求审查或解释时，不擅自改科学内容。

          候选区用于真正的替代模型、实验性实现与独立证据，不为普通修复复制整套正式代码。采用后指向唯一正式实现，并标明候选状态。不要仅为美观搬迁目录；必要重构同步修复活动引用。

          一次任务围绕明确问题和验收推进。科学资格失败限制结论，但不禁止诊断、修复和小规模验证。昂贵计算先做有判别力的小试验。真实实验、费用或超出授权的长时设备占用另行确认，不把审批扩展到普通仓库编辑。

          ## 3. 四层与验证

          区分前向物理理论、数值实现、高保真参考与结构性研究。不同模型或后端不能无说明互换，高保真也不是实验真值。

          修改方程或适用域时检查实现、配置、输出、测试与主页摘要。允许分阶段接入，但 current 必须写明“理论已改、程序未接入”和受影响输出，不能提前宣布功能完成。

          - 管理/说明修改：差异、链接、格式和受影响脚本；不例行运行大型仿真。
          - 理论修改：量纲、符号、能量、极限、适用条件及必要的独立代数或反例检查。
          - 实现修改：针对原缺陷的回归与受影响测试；改变积分、事件、网格、通量或本构时补相应一致性和收敛检查。
          - 定量结论：分别报告软件测试、数值收敛、标定、物理和留出实验验证。缺项不能用一个 PASS 总标签掩盖。

          旧 PASS 仅绑定其源版本、输入、命令、环境与覆盖范围。通过、失败、跳过和未执行分别记录。不得删有效回归或放松物理阈值制造通过；阈值变更要有独立理由。校准与留出数据分离，不能用留出结果调参后仍称盲预测。

          ## 4. 可复现证据

          支撑结论的计算记录源 commit（有未提交差异时保存 patch）、模型标识、配置/哈希、初态或随机种子、工作目录和命令、实际依赖版本、相关硬件、结果/退出原因及证据路径。小任务可记在 current 或已有报告，不强制新增 manifest 或整套锁文件。

          源码与轻量配置进入 Git。关键日志、最小反例、标定/留出划分要持久可取，不能只依赖会过期的 CI artifact 或个人绝对路径。大数据说明存储位置、校验和和恢复办法；Git 不是未入库数据的备份。冻结结果不原地改写，复算使用新位置并关联旧证据。

          长时计算与自动提交分开，先确认版本、输入、资源与实际可用的续跑方式，结束后审阅结果再提交。保留关键失败原因，不随清理消失。

          ## 5. 交接与历史

          实质改变研究、实现、验证或留下接续工作时更新 current；只读说明和无后续影响的小格式修改不强制更新。current 应包含源基线、已有能力与边界、本轮改动、实际验证/证据、下一步及验收、阻塞项。没有新任务不等于研究问题已解决，不能用“无待交接”抹掉既有积压。

          `交接说明_history.md` 按既有用户要求保持空白，默认不再追加或恢复旧内容。用 Git 与研究证据追溯，不维护第二套同义流水账：

          ```bash
          git log --oneline -- AGENTS.md README.md '90_候选工作区/交接说明_current.md'
          git show <commit>:'90_候选工作区/交接说明_current.md'
          ```

          `90_候选工作区/current/` 是沿用的材料目录名，不代表其中所有历史任务仍活跃；材料管理见 [目录说明](90_候选工作区/README.md)。

          ## 6. 提交与自动化

          默认在 main 小步提交并直接 push，不强制分支、PR、签字或固定提交数量。确需隔离竞争方案时可短期分支，但交接合并目标，避免平行正式版本。

          提交前审阅差异、明确暂存本轮文件并运行 `git diff --check`。push 前核对远端；遇到并发变动重新读取、整合并复验，不 force push，不重写他人历史，不用 reset/clean 消除未知改动。Git 数据 API 创建提交后，还须非强制更新远端 ref 才算发布。

          CI 保持只读、有界。入口检查可每次运行；软件回归按相关文件变化触发并保留手动入口。大型收敛、GPU 与装置验证不自动随交接文字启动。临时修复工作流完成后移除，不留下定时写仓库的控制器。检查失败查原因，不简单删门禁。

          最终报告使用简体中文，说明实际改动、验证边界、未完成项和 commit/push 结果。

          ## 7. Markdown

          默认 Zettlr、Pandoc Markdown；跨平台正文采用与 GFM 共同支持的普通语法。行内公式用 `$...$`，显示公式用独立成行的 `$$`。含未转义竖线的复杂公式不要放在表格中。不默认使用 GitHub Alerts、Obsidian、Mermaid 或网站专有扩展。列表、引用、围栏和表格前后保留空行。

          运行适用文档检查；有 Pandoc 时对实质改写文档解析。复杂公式/表格按交付需要渲染，环境缺失时说明未执行项，不虚报验证。
          '''
          workspace='''# 候选工作与研究证据

          本目录服务长期科研，保留既有路径。规则见 [AGENTS](../AGENTS.md)，活动工作只从 [current](交接说明_current.md) 进入。

          current 是接手状态而非累积日志，必须保留未解决问题、理论/程序差距、证据位置与下一步验收。history 保持空白，历史查 Git 与对应证据，不恢复已清空的流水账。

          `current/` 是历史沿用目录名，其中可有已完成修复、旧审查和证据；不是所有子目录都代表待办。未列为活动任务也不意味着材料可以删除。已有 archive 保持历史身份；没有 archive 的仓库不强建空目录。正式理论和程序分别在 `../01_最终理论/` 与 `../02_模拟程序/`。

          普通修复直接改正式文件。独立候选或计算证据可沿用 `current/YYYY-MM-DD_主题/`，同日追加有意义后缀，不覆盖旧结果。在材料或 current 中注明待比较、已采用、未采用或历史证据，并提供源 commit、最小复现命令与结论边界。采用后链接唯一正式实现。

          清理前检查活动引用、复现依赖和是否为唯一原始证据。归档不是每轮固定动作；移动时修复活动引用，不改写冻结快照。可重建缓存可按确认范围清理；实验原始数据、关键失败案例与支撑结论的日志必须有持久位置和校验信息，不能只依赖过期 CI artifact。
          '''
          current='''# 当前交接：涡流摆

          更新时间：2026-09-05。长期个人科研项目。本轮科学基线：`8082a88db1b7cda7826949fd02eae32bac98eae1`；本轮管理修改不提升科学结论等级。

          ## 已有能力与理论/程序差距

          [前向理论](../01_最终理论/01-前向预测理论.md) 仍为 `VP-FWD-P0-SL1-v1`，区分零来流湿态与全干。正式四状态预测在正湿面积和联合标定域内，首次全干或更早退出覆盖时终止；干机械对照独立从初始时刻选择，不自动拼接再入水。

          [实验协议](../01_最终理论/04-实验辨识、标定与留出预测协议.md) 已补系数—装置交叉协方差、条件/边际传播和共享标定误差。静态毛细恢复、被动流体记忆仅有误差预算与扩模触发条件，未凭空新增自由度。

          [正式程序](../02_模拟程序/) 已有联合支持域检查、实际时间细化、密集输出和步内守卫，求解器版本 2.1.0；**湿区终止、最小湿跨覆盖与联合协方差尚未全部接入运行/发布/拟合入口**。程序能算干湿延拓不等于可以发布装置定量结果。

          ## 接续顺序与验收

          1. **湿区合同接线，优先待实现**：统一运行、系数包和冻结发布器的正湿区/联合覆盖检查。验收包括初始全干、步内干出、闭边界、缺最小湿跨覆盖，诊断延拓不得被正式出口误标合格，不隐式清零尾流继续入水。
          2. **联合不确定度，待实现**：拟合及传播保留装置—系数相关性和条件/边际身份，避免重复计入标定误差。验收包含正/负相关合成例、共享观测参数、零交叉项特例和冻结包回读一致性。
          3. **装置输入与模型验证，待测量/标定**：独立参数、联合训练支持、留出隔离及力矩—角速度相位/平均功率同时检验。无测量时可做合成接口测试，不能把假参数称实测。只有明确残差再增加毛细或被动记忆。

          任意非线性守卫完整性、再入水尾流记忆和真实装置验证均未完成。A8S 二维 CFD 保持定性参考，不能视为实际载荷、振幅、功率和起振阈值的定量真值。

          ## 既有证据与运行入口

          [此前数值日志](current/2026-09-05_数值审查修复/validation.log) 记录 86 项测试及完整 validate；[此前理论定稿复核](current/2026-09-05_前向理论修订/final-validation.txt) 记录 8 项回归及文档检查。旧记录不是本轮重跑。旧 [基线归档](archive/2026-09-02_baseline-9123b5c6/) 及冻结 manifest 不改写。

          软件完整验证从仓库根目录进入：

          ```bash
          cd '02_模拟程序'
          npm ci
          npm run validate
          ```

          ## 本轮管理修改与验证

          重写 AGENTS，取消正式目录默认只读；主页明确长期定位、移除逐轮计数并同步已修订的干湿适用边界。新增候选目录说明，current 保留跨轮差距、优先级与验收。history 继续零字节，正式理论、程序和旧证据不变。

          保留原有完整 validate 命令；模拟 CI 按正式程序、理论、相关检查器和工作流变化触发，纯主页/交接编辑不再反复启动完整浏览器验证。文档 CI 设只读权限、超时及手动入口，仍检查理论与 current，不删除有效检查。

          本轮实际文档检查、环境和范围验证见 [管理验证](current/2026-09-05_长期维护整理/validation.txt)。本轮未重跑完整程序、数值收敛、CFD 或实验验证。查询修改历史：

          ```bash
          git log -3 --oneline
          git log -1 --format='%H %s' -- '90_候选工作区/交接说明_current.md'
          ```
          '''
          files={'AGENTS.md':textwrap.dedent(agents),'90_候选工作区/README.md':textwrap.dedent(workspace),'90_候选工作区/交接说明_current.md':textwrap.dedent(current)}
          old=Path('README.md').read_text()
          a,sep,b=old.partition('## 当前项目状态（截至 2026-09-05）\n');assert sep
          _,sep,body=b.partition('## 研究内容\n');assert sep
          status='''## 项目定位与阅读入口

          这是**长期个人科研项目**，持续维护理论、实现、数值证据与实验预测能力，不是短期弃用原型，也不以生产软件式审批代替研究。

          [当前交接](90_候选工作区/交接说明_current.md) 是动态进度、未解决问题、下一步与验证证据的唯一入口；[工作规范](AGENTS.md) 说明协作方式；[候选与证据目录](90_候选工作区/README.md) 说明材料归属。主页保留稳定介绍与物理假设，不逐轮复制测试计数或提交。history 保持空白，历史用 Git 和原始证据追溯。

          ## 当前研究边界

          正式程序已有联合标定支持检查、真实时间细化、密集输出和步内守卫。理论另明确正式湿区终止、独立干机械对照及联合协方差；这些规则尚未全部接到运行、拟合和冻结发布入口，不能把文稿修订当成已完成功能。

          真实装置测量、ROM 标定和留出预测仍未完成。A8S 二维 CFD 保持定性参考。下一步先对齐湿区及参数传播合同，再据力矩相位和平均功率残差决定扩模，不以单条轨迹吻合替代物理验证。

          '''
          revised=a+textwrap.dedent(status)+'## 研究内容\n'+body
          replacements=[
          ('- 干燥、部分浸没和全浸没状态使用同一套连续几何定义。水线跨越圆柱截面边缘时不重置状态，也不施加人工冲量。','- 干燥、部分浸没和全浸没有统一几何定义，但不等于完整尾流动力学跨全干连续。正式四状态预测限定在正湿面积的联合标定域内；干机械对照独立选择，不隐式拼接干出—再入水或施加人工冲量。'),
          ('- 工况离开参数标定所覆盖的范围；','- 首次全干，或工况先离开有依据的联合标定覆盖范围；'),
          ('这些情况意味着需要引入新的流体记忆效应、多模态或更高阶尾流模型、动态自由表面、三维流固耦合或非光滑机械模型，不能只通过临时调整当前参数来继续拟合结果。','这些情况应先区分缺失输入、实现错误与物理模型失效；确需续接时再按证据选择流体记忆、多模态、动态自由表面或接触等扩展，不自动同时加入所有机制，也不能临时调整参数继续拟合结果。')]
          for before,after in replacements:
              assert revised.count(before)==1,before
              revised=revised.replace(before,after,1)
          files['README.md']=revised
          sim=Path('.github/workflows/simulation-check.yml').read_text()
          trigger='on:\n  push:\n  pull_request:\n'
          scoped="on:\n  push:\n    paths: ['02_模拟程序/**', '01_最终理论/**', 'tools/check_markdown_math.py', '.github/workflows/simulation-check.yml']\n  pull_request:\n    paths: ['02_模拟程序/**', '01_最终理论/**', 'tools/check_markdown_math.py', '.github/workflows/simulation-check.yml']\n  workflow_dispatch:\n"
          assert sim.count(trigger)==1
          sim=sim.replace(trigger,scoped,1).replace('- uses: actions/checkout@v7\n','- uses: actions/checkout@v7\n        with:\n          persist-credentials: false\n',1)
          sim=sim.replace('jobs:\n','concurrency:\n  group: scientific-core-'+('$'+'{{ github.ref }}')+'\n  cancel-in-progress: true\n\njobs:\n',1)
          files['.github/workflows/simulation-check.yml']=sim
          md=Path('.github/workflows/markdown-check.yml').read_text()
          assert md.count(trigger)==1
          md=md.replace(trigger,trigger+'  workflow_dispatch:\n',1).replace('jobs:\n','permissions:\n  contents: read\n\njobs:\n',1).replace('runs-on: ubuntu-latest\n','runs-on: ubuntu-latest\n    timeout-minutes: 5\n',1).replace('- uses: actions/checkout@v7\n','- uses: actions/checkout@v7\n        with:\n          persist-credentials: false\n',1)
          files['.github/workflows/markdown-check.yml']=md
          for p,t in files.items():
              dest=Path(p);dest.parent.mkdir(parents=True,exist_ok=True);dest.write_text(t.rstrip()+'\n',encoding='utf-8')
          log=Path('90_候选工作区/current/2026-09-05_长期维护整理/validation.txt');log.parent.mkdir(parents=True,exist_ok=True)
          logs=['baseline='+base,'workflow='+os.environ['GITHUB_SHA'],'run='+os.environ['GITHUB_RUN_ID'],'Python='+sys.version]
          def record(s):
              print(s,flush=True);logs.append(s);log.write_text('\n'.join(logs)+'\n',encoding='utf-8')
          def run(args,cwd=None):
