name: Finalize forward theory notation
on:
  push:
    branches: [main]
    paths: [.github/workflows/theory-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Clarify calibrated derived coordinates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('01_最终理论/01-前向预测理论.md')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='e445657c6b7f8dde902a5119a7404ae138af7176'
          s=p.read_text()
          old=r'\ (t,X)\in\mathcal D_{\rm cal},'
          new=r'\ \text{由 }(t,X)\text{ 派生的联合工况属于 }\mathcal D_{\rm cal},'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          c=Path('90_候选工作区/交接说明_current.md')
          c.write_text(c.read_text()+'\n## 定稿复核\n\n湿区集合明确检查由状态派生的联合工况是否属于标定域，而不是把原始时间—状态对直接当作无量纲标定坐标。此处只修正集合记法，不新增参数或改变机械右端。定稿后重新执行同一组 8 项回归和原有文档检查；日志见同目录 final-validation.txt。\n')
          PY
      - name: Revalidate final manuscript
        shell: bash
        run: |
          set -euo pipefail
          d='90_候选工作区/current/2026-09-05_前向理论修订'
          { python3 "$d/check_theory.py"; (cd '02_模拟程序' && bash scripts/check-docs.sh); git diff --check; } 2>&1 | tee "$d/final-validation.txt"
      - name: Commit and push final revision
        run: |
          set -euo pipefail
          rm .github/workflows/theory-finalize.yml
          test ! -s '90_候选工作区/交接说明_history.md'
          git diff --check
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '01_最终理论/01-前向预测理论.md' '90_候选工作区/交接说明_current.md' '90_候选工作区/current/2026-09-05_前向理论修订/final-validation.txt'
          git add -u .github/workflows/theory-finalize.yml
          git commit -m 'docs(theory): distinguish state variables from joint calibration coordinates'
          git push origin HEAD:main
          git rev-parse HEAD
