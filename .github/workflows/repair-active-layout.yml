name: Repair active layout references

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 02_模拟程序/package-lock.json
      - name: Repair generated-artifact contracts and remove obsolete snapshots
        run: |
          python3 - <<'PY'
          from pathlib import Path

          artifact_files = [
              Path("02_模拟程序/scripts/analyze-cross-layer.ts"),
              Path("02_模拟程序/scripts/analyze-high-fidelity-grid.ts"),
              Path("02_模拟程序/scripts/analyze-structure.ts"),
              Path("02_模拟程序/scripts/audit-forward-convergence.ts"),
              Path("02_模拟程序/scripts/audit-high-fidelity.ts"),
              Path("02_模拟程序/scripts/plot-structure.py"),
              Path("02_模拟程序/scripts/sweep-forward.ts"),
          ]
          for path in artifact_files:
              text = path.read_text(encoding="utf-8")
              original = text
              text = text.replace(
                  "../03-项目资料/03-计算结果与证据/artifacts",
                  "../90_候选工作区/current/验证与复现/artifacts",
              )
              text = text.replace(
                  "03-项目资料/03-计算结果与证据/artifacts",
                  "90_候选工作区/current/验证与复现/artifacts",
              )
              if text == original:
                  raise RuntimeError(f"no obsolete artifact path found in {path}")
              if "03-项目资料" in text or "03_项目资料" in text:
                  raise RuntimeError(f"obsolete artifact path remains in {path}")
              path.write_text(text, encoding="utf-8")

          obsolete_test = Path("02_模拟程序/tests/cross-layer-artifacts.test.ts")
          if not obsolete_test.is_file():
              raise RuntimeError("obsolete generated-artifact snapshot test is missing")
          obsolete_test.unlink()

          document = Path("02_模拟程序/文档/二维截面流体参考程序.md")
          text = document.read_text(encoding="utf-8")
          text = text.replace("../../01-最终理论/", "../../01_最终理论/")

          lines = text.splitlines(keepends=True)
          archived_rows = [
              line for line in lines
              if "../../03-项目资料/04-审查与交付归档/" in line
          ]
          if len(archived_rows) != 2:
              raise RuntimeError(f"expected two obsolete archive rows, found {len(archived_rows)}")
          text = "".join(
              line for line in lines
              if "../../03-项目资料/04-审查与交付归档/" not in line
          )

          historical_note = "> **A0 历史证据说明**：本节的旧数值和原 artifact 已按原 SHA-256 冻结，仍可复现其“当时如何执行”。但由于 applied/diagnostic 时层混用和不完整应力圆周缺陷，其动态物理取力验证和装置趋势证据已撤回。伴随清单在 `../../03-项目资料/03-计算结果与证据/artifacts/legacy-a0/`。\n\n"
          if text.count(historical_note) != 1:
              raise RuntimeError("unexpected historical A0 note")
          text = text.replace(historical_note, "")

          subsection_start = text.index("### 17.1.1 A0/A1 新增证据\n")
          subsection_end = text.index("### 17.2 三网格", subsection_start)
          text = text[:subsection_start] + text[subsection_end:]

          text = text.replace(
              "../03-项目资料/03-计算结果与证据/artifacts",
              "../90_候选工作区/current/验证与复现/artifacts",
          )
          text = text.replace(
              "../../03-项目资料/03-计算结果与证据/artifacts",
              "../../90_候选工作区/current/验证与复现/artifacts",
          )

          for obsolete in ("03-项目资料", "03_项目资料", "01-最终理论", "02-模拟程序"):
              if obsolete in text:
                  raise RuntimeError(f"obsolete repository reference remains in CFD document: {obsolete}")
          document.write_text(text, encoding="utf-8")

          policy = Path("tools/check_repository_policy.py")
          policy_text = policy.read_text(encoding="utf-8")
          marker = '    "archive/pre-" + "03-90-consolidation",\n'
          addition = marker + '    "01-" + "最终理论",\n    "02-" + "模拟程序",\n'
          if policy_text.count(marker) != 1:
              raise RuntimeError("unexpected repository-policy reference tuple")
          policy.write_text(policy_text.replace(marker, addition), encoding="utf-8")
          PY

          python3 -m py_compile \
            tools/check_repository_policy.py \
            tools/check_markdown_math.py \
            "02_模拟程序/scripts/plot-structure.py"
          bash -n "02_模拟程序/scripts/check-docs.sh"
          python3 tools/check_repository_policy.py
          python3 tools/check_markdown_math.py
          git diff --check
      - name: Commit repaired active layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair active layout references"
          git push
      - name: Run program and documentation validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          log=/tmp/vortex-validation.log
          : > "$log"
          failed=0
          run_step() {
            printf '\n$ %s\n' "$*" >> "$log"
            "$@" >> "$log" 2>&1
            status=$?
            if (( status != 0 )); then
              printf 'exit=%s\n' "$status" >> "$log"
              failed=1
            fi
          }

          run_step npm --prefix "02_模拟程序" ci
          run_step npm --prefix "02_模拟程序" run test
          run_step npm --prefix "02_模拟程序" run build
          run_step npm --prefix "02_模拟程序" run desktop:check
          run_step npm --prefix "02_模拟程序" run docs:check
          set -e

          probe_ref="heads/validation/policy-probe"
          probe_branch="validation/policy-probe"
          diagnostic_path="validation-diagnostic.txt"
          if (( failed != 0 )); then
            encoded="$(base64 -w 0 "$log")"
            existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${diagnostic_path}?ref=${probe_branch}" --jq .sha 2>/dev/null || true)"
            if [[ -n "$existing_sha" ]]; then
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${diagnostic_path}" \
                -f message="Update program-validation diagnostic" \
                -f content="$encoded" \
                -f branch="$probe_branch" \
                -f sha="$existing_sha" >/dev/null
            else
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${diagnostic_path}" \
                -f message="Record program-validation diagnostic" \
                -f content="$encoded" \
                -f branch="$probe_branch" >/dev/null
            fi
            cat "$log"
            exit 1
          fi

          cat "$log"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/${probe_ref}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/${probe_ref}" >/dev/null 2>&1; then
            echo "validation probe branch still exists" >&2
            exit 1
          fi
