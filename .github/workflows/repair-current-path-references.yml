name: repair-current-path-references

on:
  push:
    branches: [main]
    paths:
      - tools/repair_current_path_references.py
      - .github/workflows/repair-current-path-references.yml

permissions:
  contents: write

concurrency:
  group: repair-current-path-references
  cancel-in-progress: false

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Repair exact stale references
        run: python tools/repair_current_path_references.py

      - name: Validate repository structure
        run: python tools/check_repository_layout.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate active candidate
        working-directory: 90_候选工作区/current/候选实现
        run: |
          npm ci
          npm run validate

      - name: Validate mature program
        working-directory: 02_模拟程序
        run: |
          npm ci
          npm run validate

      - name: Record successful current validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          status = Path('00_项目控制/STATUS.md')
          status.write_text('''# 当前状态

更新日期：2026-08-24

## 当前候选

- 名称：P0 预测链闭合隔离候选。
- 路径：[`../90_候选工作区/current/`](../90_候选工作区/current/)。
- 分支：`main`。
- 成熟基线回写：未执行。

## 资格边界

```text
P0_CANDIDATE_BOUND_EVIDENCE = PASS
CURRENT_COMMIT_IMPLEMENTATION_VALIDATION = PASS
ACTIVE_MARKDOWN_MATH_RENDERING = PASS
APPARATUS_CALIBRATION = false
QUANTITATIVE_PREDICTION_QUALIFIED = false
CANDIDATE_PROMOTED = false
```

活动候选和成熟程序的失效连字符路径已经修正；仓库结构检查、候选完整 `npm run validate` 和成熟程序完整 `npm run validate` 均在同一工作树中通过。该结果只建立当前实现与既有测试门的一致性，不建立装置标定、三维自由表面等价性或实物定量预测资格。

## 下一步

1. 完成未闭合的长时间、求积、事件和结构分析 P0 门。
2. 对准备回写的组件进行独立审查和逐文件映射。
3. 只有在用户指定具体范围后，才回写成熟基线。
''', encoding='utf-8')

          record = Path('90_候选工作区/current/管理/验证记录.md')
          marker = '## 当前路径修复与完整复验'
          text = record.read_text(encoding='utf-8')
          if marker not in text:
              text += '''

## 当前路径修复与完整复验

- 修正候选源码和测试中指向 `02-模拟程序/` 的失效导入。
- 修正成熟跨层测试中指向 `03-项目资料/` 的失效数据路径。
- `python tools/check_repository_layout.py`：PASS。
- 候选 `npm ci && npm run validate`：PASS。
- 成熟程序 `npm ci && npm run validate`：PASS。
- 本次只修正路径和结构约束，不修改物理方程、参数、容差、测试断言或预测资格边界。
'''
              record.write_text(text, encoding='utf-8')
          PY

      - name: Recheck final working tree
        run: |
          python tools/check_repository_layout.py
          git diff --check

      - name: Commit repaired paths and validation state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          allowed = {
              '00_项目控制/STATUS.md',
              '02_模拟程序/tests/cross-layer-artifacts.test.ts',
              '90_候选工作区/current/管理/验证记录.md',
              '90_候选工作区/current/候选实现/src/forward/model.ts',
              '90_候选工作区/current/候选实现/src/highFidelity/strip-wetting.ts',
              '90_候选工作区/current/候选实现/src/structure/equilibrium.ts',
              '90_候选工作区/current/候选实现/tests/applicability-gates.test.ts',
              '90_候选工作区/current/候选实现/tests/equilibrium-numerics.test.ts',
              '90_候选工作区/current/候选实现/tests/equilibrium.test.ts',
              '90_候选工作区/current/候选实现/tests/strip-wetting-boundaries.test.ts',
              '90_候选工作区/current/候选实现/tests/strip-wetting.test.ts',
              '90_候选工作区/current/候选实现/tests/wetting-contract.test.ts',
              '90_候选工作区/current/候选实现/tests/wetting.test.ts',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit('unexpected modified files: ' + ', '.join(sorted(unexpected)))
          if not changed:
              raise SystemExit('repair workflow produced no changes')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u
          git commit -m "Fix current path references and revalidate programs"
          git push origin HEAD:main
