name: Finalize active layout repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 02_模拟程序/package-lock.json
      - name: Repair, validate, and commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          log=/tmp/finalize-layout.log
          : > "$log"

          python3 - <<'PY' >> "$log" 2>&1
          from pathlib import Path

          artifact_files = [
              Path("02_模拟程序/scripts/analyze-cross-layer.ts"),
              Path("02_模拟程序/scripts/analyze-high-fidelity-grid.ts"),
              Path("02_模拟程序/scripts/analyze-structure.ts"),
              Path("02_模拟程序/scripts/audit-forward-convergence.ts"),
              Path("02_模拟程序/scripts/audit-high-fidelity.ts"),
              Path("02_模拟程序/scripts/plot-structure.py"),
              Path("02_模拟程序/scripts/sweep-forward.ts"),
          ]
          old_artifact = "../" + "03-项目资料/03-计算结果与证据/artifacts"
          old_root_artifact = "03-" + "项目资料/03-计算结果与证据/artifacts"
          new_artifact = "../90_候选工作区/current/验证与复现/artifacts"
          new_root_artifact = "90_候选工作区/current/验证与复现/artifacts"
          for path in artifact_files:
              text = path.read_text(encoding="utf-8")
              original = text
              text = text.replace(old_artifact, new_artifact)
              text = text.replace(old_root_artifact, new_root_artifact)
              if text == original:
                  raise RuntimeError(f"no obsolete artifact path found in {path}")
              if "03-" + "项目资料" in text or "03_" + "项目资料" in text:
                  raise RuntimeError(f"obsolete artifact path remains in {path}")
              path.write_text(text, encoding="utf-8")

          obsolete_test = Path("02_模拟程序/tests/cross-layer-artifacts.test.ts")
          if not obsolete_test.is_file():
              raise RuntimeError("obsolete generated-artifact snapshot test is missing")
          obsolete_test.unlink()

          document = Path("02_模拟程序/文档/二维截面流体参考程序.md")
          text = document.read_text(encoding="utf-8")
          old_theory_root = "../../01-" + "最终理论/"
          text = text.replace(old_theory_root, "../../01_最终理论/")

          old_archive_root = "../../03-" + "项目资料/04-审查与交付归档/"
          lines = text.splitlines(keepends=True)
          archived_rows = [line for line in lines if old_archive_root in line]
          if len(archived_rows) != 2:
              raise RuntimeError(f"expected two obsolete archive rows, found {len(archived_rows)}")
          text = "".join(line for line in lines if old_archive_root not in line)

          historical_prefix = "> **A0 历史证据说明**："
          note_start = text.index(historical_prefix)
          note_end = text.index("\n\n", note_start) + 2
          text = text[:note_start] + text[note_end:]

          subsection_start = text.index("### 17.1.1 A0/A1 新增证据\n")
          subsection_end = text.index("### 17.2 三网格", subsection_start)
          text = text[:subsection_start] + text[subsection_end:]

          old_doc_artifact = "../" + "03-项目资料/03-计算结果与证据/artifacts"
          old_doc_artifact2 = "../../" + "03-项目资料/03-计算结果与证据/artifacts"
          text = text.replace(old_doc_artifact2, "../../90_候选工作区/current/验证与复现/artifacts")
          text = text.replace(old_doc_artifact, "../90_候选工作区/current/验证与复现/artifacts")

          for obsolete in (
              "03-" + "项目资料",
              "03_" + "项目资料",
              "01-" + "最终理论",
              "02-" + "模拟程序",
          ):
              if obsolete in text:
                  raise RuntimeError(f"obsolete repository reference remains in CFD document: {obsolete}")
          document.write_text(text, encoding="utf-8")

          policy = Path("tools/check_repository_policy.py")
          policy_text = policy.read_text(encoding="utf-8")
          marker = '    "archive/pre-" + "03-90-consolidation",\n'
          addition = marker + '    "01-" + "最终理论",\n    "02-" + "模拟程序",\n'
          if policy_text.count(marker) != 1:
              raise RuntimeError("unexpected repository-policy reference tuple")
          policy.write_text(policy_text.replace(marker, addition), encoding="utf-8")
          PY
          patch_status=$?

          rm -f .github/workflows/repair-active-layout.yml
          rm -f .github/workflows/finalize-active-layout.yml

          if (( patch_status == 0 )); then
            python3 -m py_compile \
              tools/check_repository_policy.py \
              tools/check_markdown_math.py \
              "02_模拟程序/scripts/plot-structure.py" >> "$log" 2>&1
            static_status=$?
            bash -n "02_模拟程序/scripts/check-docs.sh" >> "$log" 2>&1 || static_status=1
            python3 tools/check_repository_policy.py >> "$log" 2>&1 || static_status=1
            python3 tools/check_markdown_math.py >> "$log" 2>&1 || static_status=1
            git diff --check >> "$log" 2>&1 || static_status=1
          else
            static_status=1
          fi

          if (( static_status == 0 )); then
            npm --prefix "02_模拟程序" ci >> "$log" 2>&1
            test_status=$?
            npm --prefix "02_模拟程序" run test >> "$log" 2>&1 || test_status=1
            npm --prefix "02_模拟程序" run build >> "$log" 2>&1 || test_status=1
            npm --prefix "02_模拟程序" run desktop:check >> "$log" 2>&1 || test_status=1
            npm --prefix "02_模拟程序" run docs:check >> "$log" 2>&1 || test_status=1
          else
            test_status=1
          fi
          set -e

          probe_ref="heads/validation/policy-probe"
          probe_branch="validation/policy-probe"
          diagnostic_path="validation-diagnostic.txt"
          if (( patch_status != 0 || static_status != 0 || test_status != 0 )); then
            encoded="$(base64 -w 0 "$log")"
            existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${diagnostic_path}?ref=${probe_branch}" --jq .sha 2>/dev/null || true)"
            if [[ -n "$existing_sha" ]]; then
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${diagnostic_path}" \
                -f message="Update finalization diagnostic" \
                -f content="$encoded" \
                -f branch="$probe_branch" \
                -f sha="$existing_sha" >/dev/null
            else
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${diagnostic_path}" \
                -f message="Record finalization diagnostic" \
                -f content="$encoded" \
                -f branch="$probe_branch" >/dev/null
            fi
            cat "$log"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair active layout references"
          git push

          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/${probe_ref}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/${probe_ref}" >/dev/null 2>&1; then
            echo "validation probe branch still exists" >&2
            exit 1
          fi
