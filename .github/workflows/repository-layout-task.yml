name: Repository layout task
on:
  push:
    branches: [main]
    paths: [.github/workflows/repository-layout-task.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: repository-layout-task
  cancel-in-progress: false
env:
  GIT_LFS_SKIP_SMUDGE: '1'
  MPLBACKEND: Agg
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: layout-migration-validation
          run-id: 33931692454
          github-token: ${{ github.token }}
          path: /tmp/first-layout-validation
      - uses: actions/download-artifact@v4
        with:
          name: layout-migration-validation
          run-id: 33931886055
          github-token: ${{ github.token }}
          path: /tmp/second-layout-validation
      - name: Record pre-migration browser baseline without changing its assertions
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          paths = subprocess.check_output(['git','ls-files','-z','02_模拟程序']).decode().split('\0')[:-1]
          paths = [p for p in paths if '/tests/' not in p and not p.endswith('.md')]
          h = {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}
          pathlib.Path('/tmp/runtime-before.json').write_text(json.dumps(h, ensure_ascii=False, indent=2))
          PY
          cd '02_模拟程序'
          npm ci
          npm run build
          npm run desktop:check
          python - <<'PY'
          import json, pathlib, subprocess
          p = subprocess.run(['npm','run','test:e2e'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=180)
          pathlib.Path('/tmp/e2e-before.txt').write_bytes(p.stdout)
          pathlib.Path('/tmp/e2e-before.json').write_text(json.dumps({'exit_code': p.returncode}))
          print(p.stdout.decode(errors='replace'))
          print('BASELINE_BROWSER_EXIT', p.returncode)
          PY
      - name: Apply hash-checked migration and retain original failed attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs/bd2a91556cf30e30ae5b0340352e57310fb88f98'
          request = urllib.request.Request(url, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              blob = json.load(response)
          code = gzip.decompress(base64.b64decode(blob['content']))
          assert hashlib.sha256(code).hexdigest() == '94f162d27d769d2e54e43b89acc89045f5907471a02dada5b40c44d191e086db'
          pathlib.Path('/tmp/migrate.py').write_bytes(code)
          PY
          python /tmp/migrate.py 13 | tee /tmp/layout-apply.txt
          python - <<'PY'
          import hashlib, json, pathlib
          task = pathlib.Path('03_研究记录/维护/2026-09-05_目录重组')
          for name, source in [('validation-first-attempt.txt','/tmp/first-layout-validation/validation.txt'),('validation-second-attempt.txt','/tmp/second-layout-validation/validation.txt'),('e2e-before.txt','/tmp/e2e-before.txt'),('runtime-before.json','/tmp/runtime-before.json')]:
              (task/name).write_bytes(pathlib.Path(source).read_bytes())
          baseline = json.loads(pathlib.Path('/tmp/runtime-before.json').read_text())
          for path, expected in baseline.items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() == expected, path
          print('RUNTIME BYTE IDENTITY VERIFIED', len(baseline))
          PY
          git add -A
          git add -f --pathspec-from-file=/tmp/iypt-relocated-paths --pathspec-file-nul
          test -z "$(git diff --cached --name-only -- '02_模拟程序/src' '02_模拟程序/scripts' '02_模拟程序/package.json' '02_模拟程序/package-lock.json')"
      - name: Validate layout and software components, report browser result separately
        run: |
          set -euo pipefail
          task='03_研究记录/维护/2026-09-05_目录重组'
          cp .github/workflows/repository-layout-task.yml "$task/execution-workflow.yml"
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Source commit: $GITHUB_SHA"
            echo "Actions run: $GITHUB_RUN_ID"
            echo 'Scope: layout migration. Browser acceptance is reported independently; failures are never reclassified as passing.'
            cat /tmp/layout-apply.txt
            python --version
            uname -a
            python -m unittest discover -s tools -p 'test_repository_docs.py' -v
            python tools/check_repository_docs.py
            python tools/check_markdown_math.py
            cd '02_模拟程序'
            node --version
            npm --version
            npm run test
            npm run build
            npm run desktop:check
            npm run docs:check
            python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          task = root/'03_研究记录/维护/2026-09-05_目录重组'
          before = json.loads(pathlib.Path('/tmp/e2e-before.json').read_text())['exit_code']
          p = subprocess.run(['npm','run','test:e2e'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=180)
          (task/'e2e-after.txt').write_bytes(p.stdout)
          print(p.stdout.decode(errors='replace'))
          first = pathlib.Path('/tmp/e2e-before.txt').read_bytes()
          unchanged = json.loads(pathlib.Path('/tmp/runtime-before.json').read_text())
          for path, digest in unchanged.items():
              assert hashlib.sha256((root/path).read_bytes()).hexdigest() == digest, path
          if p.returncode == 0:
              disposition = 'browser_pass_after_migration; earlier_timeouts_remain_unresolved'
              detail = '本次迁移后浏览器检查通过；此前两次 20 秒超时仍保留，尚未定位波动机制，不能据单次通过宣布稳定性问题解决。'
          else:
              signature = b'Timeout 20000ms exceeded'
              target = b'#termination-badge'
              assert before != 0 and signature in first and signature in p.stdout and target in first and target in p.stdout, 'new or different browser failure: do not publish'
              disposition = 'known_preexisting_browser_timeout; full_validate_not_passed'
              detail = '迁移前后相同浏览器测试均在等待 COMPLETED 时触发原有 20 秒超时。运行源码、配置、依赖锁及测试脚本逐文件哈希相同；本轮未改变该测试或阈值。目录迁移与独立组件检查通过，但完整 npm run validate 未通过。此问题作为既有运行/测试缺陷保留，不宣称已修复。'
          summary = {'source_commit':os.environ['GITHUB_SHA'], 'actions_run':os.environ['GITHUB_RUN_ID'], 'before_exit_code':before, 'after_exit_code':p.returncode, 'runtime_files_byte_identical':len(unchanged), 'disposition':disposition}
          (task/'browser-comparison.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2)+'\n')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          current = root/'00_项目管理/交接说明_current.md'
          current.write_text(current.read_text() + '\n## 浏览器回归：独立保留的未解决项\n\n' + detail + '\n\n[前后对照](../03_研究记录/维护/2026-09-05_目录重组/browser-comparison.json)、[迁移前原文](../03_研究记录/维护/2026-09-05_目录重组/e2e-before.txt)、[迁移后原文](../03_研究记录/维护/2026-09-05_目录重组/e2e-after.txt)、[首次失败](../03_研究记录/维护/2026-09-05_目录重组/validation-first-attempt.txt) 和 [第二次失败](../03_研究记录/维护/2026-09-05_目录重组/validation-second-attempt.txt) 均已保留。\n\n接续时先抓取页面 run-state、termination-badge、Worker/控制台错误和计算耗时，区分事件终止、运行错误与性能超时。验收保持原浏览器成功条件；不以删除断言、延长科学积分步长或把失败改标 PASS 来消除红灯。永久完整验证工作流仍运行原始 npm run validate。\n', encoding='utf-8')
          PY
            cd "$GITHUB_WORKSPACE"
            python tools/check_repository_docs.py
            echo 'NOT RUN: historical large convergence cases, GPU hardware qualification, apparatus experiments, hydrated LFS object verification.'
            echo 'LAYOUT ACCEPTED: directory and component checks passed; browser status is in browser-comparison.json. This is not a blanket software PASS.'
          } 2>&1 | tee "$task/validation.txt"
          git add -- "$task" '00_项目管理/交接说明_current.md'
      - name: Verify preserved bytes and publish only the isolated layout change
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          m = json.loads(pathlib.Path('03_研究记录/维护/2026-09-05_目录重组/migration.json').read_text())
          for item in m['preserved_files']:
              data = subprocess.check_output(['git','show',':'+item['new']])
              assert len(data) == item['size'] and hashlib.sha256(data).hexdigest() == item['sha256'], item['new']
          assert pathlib.Path('00_项目管理/交接说明_history.md').stat().st_size == 0
          print('STAGED ORIGINAL BYTES VERIFIED', len(m['preserved_files']))
          PY
          git diff --exit-code
          git diff --cached --check
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: organize long-term workspaces and retain baseline browser regression evidence'
          git push origin HEAD:main
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-migration-validation
          path: 03_研究记录/维护/2026-09-05_目录重组/validation.txt
          if-no-files-found: ignore
          retention-days: 7
