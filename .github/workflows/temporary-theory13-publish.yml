name: Temporary theory13 verification and publication
on:
  push:
    branches: [main]
    paths: [.github/workflows/temporary-theory13-publish.yml]
permissions:
  contents: write
  actions: read
jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore reviewed changes and preserve first remote run unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, lzma, os, pathlib, subprocess, zipfile
          api = 'https://api.github.com/repos/cjt42554-crypto/iypt-13-Vortex_pendulum'
          def get(suffix):
              return subprocess.check_output(['curl','--fail','--silent','--show-error','--location','--retry','2','--max-time','45','-H','Authorization: Bearer '+os.environ['GH_TOKEN'],'-H','Accept: application/vnd.github+json',api+suffix])
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() == '0affd68e886b680f39778ce2558b7084fb527692'
          shas = ['15ddc5dd6368e061acaedadc30759d30082f40ad','49577c63a27406f8966c933337c33a9009bc8faf','f444b6ffdf4eb688dbc24b8a6efa988355bdad5a','360f47ec59e11d0e469634e9e161ce3e746b012c','4286ae184d6f802fa98a9c0ad9da138345448b8c']
          raw = b''.join(base64.b64decode(json.loads(get('/git/blobs/'+sha))['content']) for sha in shas)
          assert hashlib.sha256(raw).hexdigest() == 'bb7779fdce0e65282df8b4f2651a3c71f24f36f07321a6bda5e1030e7c4d6219'
          payload = json.loads(lzma.decompress(raw))
          assert subprocess.check_output(['git','rev-parse','HEAD:02_模拟程序'],text=True).strip() == payload['production_tree'] == '46efa1569b8e0ef0ab9a73ea2ce6e68d481deed8'
          allowed = {'README.md','00_项目管理/交接说明_current.md','01_最终理论/README.md','01_最终理论/01-前向预测理论.md','01_最终理论/02-前向预测理论的数值计算理论.md','01_最终理论/03-结构性理论.md','01_最终理论/04-实验辨识、标定与留出预测协议.md'}
          rec = pathlib.Path('03_研究记录/维护/2026-09-05_辨识摩擦与湿截面理论修订')
          prefix = str(rec)+'/'
          assert set(payload['old_sha256']) == allowed
          for name in payload['expected']:
              p = pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert name in allowed or name.startswith(prefix)
          for name,expected in payload['old_sha256'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == expected,name
          patch = payload['patch'].encode()
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          changed = set(subprocess.check_output(['git','-c','core.quotepath=false','diff','--name-only'],text=True).splitlines())
          assert changed == allowed
          for entry in payload['new']:
              p = pathlib.Path(entry['path'])
              assert str(p).startswith(prefix) and not p.exists()
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(entry['content'],encoding='utf-8')
          for name,expected in payload['expected'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == expected,name
          archive = get('/actions/artifacts/9963589526/zip')
          assert hashlib.sha256(archive).hexdigest() == '8b9c6d0fe40226a48de7e9a12b4f9b3e0d4d477c0dc954fc72339fd75e50e9d6'
          z = zipfile.ZipFile(io.BytesIO(archive))
          for name,expected in payload['expected'].items():
              assert hashlib.sha256(z.read(name)).hexdigest() == expected,name
          names = ['theory-remote.txt','docs-unit-remote.txt','docs-entry-remote.txt','math-remote.txt','npm-install-remote.txt','formal-validation-remote.txt','results-remote.json','remote-summary.json']
          first = rec/'first-remote'
          first.mkdir()
          digests = {}
          for name in names:
              data = z.read(prefix+name)
              (first/name).write_bytes(data)
              digests[name] = hashlib.sha256(data).hexdigest()
          prior = json.loads((first/'remote-summary.json').read_text())
          assert [x['returncode'] for x in prior['commands']] == [0,0,0,0,0,1]
          assert json.loads((first/'results-remote.json').read_text())['tests'] == {'run':35,'failures':0,'errors':0,'skipped':0}
          assert 'Timeout 20000ms exceeded' in (first/'formal-validation-remote.txt').read_text()
          (first/'provenance.json').write_text(json.dumps({'run_id':33946781247,'artifact_id':9963589526,'artifact_sha256':'8b9c6d0fe40226a48de7e9a12b4f9b3e0d4d477c0dc954fc72339fd75e50e9d6','files':digests},indent=2)+'\n')
          assert pathlib.Path('00_项目管理/交接说明_history.md').stat().st_size == 0
          subprocess.run(['git','diff','--exit-code','--','02_模拟程序'],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          pathlib.Path('/tmp/theory13-payload-paths.json').write_text(json.dumps(list(payload['expected']),ensure_ascii=False))
          print('All reviewed files and first remote evidence verified; production and test thresholds unchanged.')
          PY
      - name: Install independent verification dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 sympy==1.14.0
      - name: Independent full rerun with truthful UI disposition
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, platform, re, subprocess, sys, time
          root = pathlib.Path.cwd()
          rec = root/'03_研究记录/维护/2026-09-05_辨识摩擦与湿截面理论修订'
          local_results = (rec/'results.json').read_bytes()
          commands = [
            ('theory-remote.txt',[sys.executable,str(rec/'verify_wake_friction_geometry.py')],root,120),
            ('docs-unit-remote.txt',[sys.executable,'-m','unittest','discover','-s','tools','-p','test_repository_docs.py','-v'],root,60),
            ('docs-entry-remote.txt',[sys.executable,'tools/check_repository_docs.py'],root,60),
            ('math-remote.txt',[sys.executable,'tools/check_markdown_math.py'],root,60),
            ('docs-boundary-remote.txt',['bash','scripts/check-docs.sh'],root/'02_模拟程序',60),
            ('npm-install-remote.txt',['npm','ci'],root/'02_模拟程序',240),
            ('formal-validation-remote.txt',['npm','run','validate'],root/'02_模拟程序',480),
          ]
          results = []
          environment = {'python':platform.python_version(),'platform':platform.platform(),'node':subprocess.check_output(['node','--version'],text=True).strip(),'npm':subprocess.check_output(['npm','--version'],text=True).strip(),'run_id':os.environ['GITHUB_RUN_ID'],'parent':os.environ['GITHUB_SHA']}
          formal_pass = False
          for name,cmd,cwd,timeout in commands:
              print('Running',name,flush=True)
              started = time.monotonic()
              entry = {'log':name,'command':cmd,'cwd':str(cwd.relative_to(root)) or '.','timeout_seconds':timeout}
              try:
                  with (rec/name).open('w') as log:
                      proc = subprocess.run(cmd,cwd=cwd,stdout=log,stderr=subprocess.STDOUT,timeout=timeout)
                  entry['returncode'] = proc.returncode
              except subprocess.TimeoutExpired:
                  entry['returncode'] = None
                  entry['status'] = 'timeout'
              finally:
                  if name == 'theory-remote.txt':
                      (rec/'results-remote.json').write_bytes((rec/'results.json').read_bytes())
                      (rec/'results.json').write_bytes(local_results)
                  entry['elapsed_seconds'] = time.monotonic()-started
                  results.append(entry)
                  (rec/'remote-summary.json').write_text(json.dumps({'environment':environment,'commands':results},ensure_ascii=False,indent=2)+'\n')
              text = (rec/name).read_text()
              clean = re.sub(r'\x1b\[[0-9;]*m','',text)
              print(text[-4000:],flush=True)
              if name == 'formal-validation-remote.txt':
                  assert re.search(r'Tests\s+86 passed',clean)
                  assert 'test:e2e' in clean and 'desktop:check' in clean and '"status": "PASS"' in clean
                  formal_pass = entry['returncode'] == 0
                  if not formal_pass:
                      assert entry['returncode'] == 1 and 'Timeout 20000ms exceeded' in clean and "locator('#termination-badge')" in clean, 'Unexpected regression failure; do not publish.'
                      entry['disposition'] = 'unchanged_browser_timeout_reproduced; full_validate_FAILED'
              elif entry['returncode'] != 0:
                  raise RuntimeError('Required verification failed: '+name)
          theory = json.loads((rec/'results-remote.json').read_text())
          assert theory['tests'] == {'run':35,'failures':0,'errors':0,'skipped':0}
          assert re.search(r'Ran 16 tests',(rec/'docs-unit-remote.txt').read_text())
          outcome = '第二次原有 npm run validate 全部通过，包含 86 项单元测试、构建、桌面入口、浏览器端到端和文档边界检查。' if formal_pass else '第二次原有 npm run validate 仍失败于等待 COMPLETED 的 20 秒浏览器超时；此前的 86 项单元测试、构建和桌面入口通过，文档边界检查另行独立通过。不能报告完整 validate 通过。'
          record = '\n## 本轮远端复跑与浏览器失败保留\n\n两次完整仓库的 35 项理论/文档核查、16 项检查器自测、活动入口与数学检查均通过。首次运行 33946781247 的原 validate 在 86 项单元测试、构建和桌面入口通过后，因旧浏览器 20 秒等待超时退出 1，未提交；全部首次原始日志和哈希保存在 `first-remote/`。没有改变测试阈值或生产程序。'+outcome+' 两次实际退出码、环境和命令分别见 `first-remote/remote-summary.json` 与 `remote-summary.json`。既有浏览器稳定性问题继续开放；本轮理论发布不等于 UI 已修好。未做大型 CFD、GPU 或装置验证。\n'
          with (rec/'README.md').open('a') as f: f.write(record)
          current = root/'00_项目管理/交接说明_current.md'
          old = '完整远端复跑将独立写入同目录 `remote-summary.json` 和原始日志；读取交接时以这些实际证据的存在与退出码为准，不能由本段推断远端运行成功。本轮未做大型 CFD、GPU 或装置实验。'
          new = '远端两次 35 项理论/文档核查、16 项检查器自测、活动入口与数学检查通过。首次完整 validate 在 86 项单元测试、构建和桌面入口通过后遇到旧浏览器 20 秒超时，未提交；原始失败证据在本轮记录 first-remote 子目录。'+outcome+' 见[第二次远端摘要](../03_研究记录/维护/2026-09-05_辨识摩擦与湿截面理论修订/remote-summary.json)及[第一次摘要](../03_研究记录/维护/2026-09-05_辨识摩擦与湿截面理论修订/first-remote/remote-summary.json)。生产代码、原测试与超时阈值未改，浏览器稳定性问题继续开放。未做大型 CFD、GPU 或装置实验。'
          text = current.read_text()
          assert text.count(old) == 1
          current.write_text(text.replace(old,new))
          metadata = {'scientific_base':'0ceb7b73c808e1261333a099587d965ee0d31e6c','source_snapshot':'576dcd807347051106c68dcff37fe07c80fec413','publishing_parent':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'first_run_id':33946781247,'formal_complete_pass':formal_pass,'forward_theory_sha256':hashlib.sha256((root/'01_最终理论/01-前向预测理论.md').read_bytes()).hexdigest(),'verification_script_sha256':hashlib.sha256((rec/'verify_wake_friction_geometry.py').read_bytes()).hexdigest(),'production_tree_sha':'46efa1569b8e0ef0ab9a73ea2ce6e68d481deed8'}
          assert metadata['forward_theory_sha256'] == '8f83a2c122ab91152fb8ac5fb4e99885f19a35f47f70b0eba4f723ceae79a600'
          assert metadata['verification_script_sha256'] == 'c41909dea2e81c6e946dda848e5a2d44891f2a4c4a60840e8768d0b594cbb4e5'
          (rec/'publication.json').write_text(json.dumps(metadata,ensure_ascii=False,indent=2)+'\n')
          (rec/'remote-summary.json').write_text(json.dumps({'environment':environment,'commands':results,'formal_complete_pass':formal_pass,'browser_stability_issue':'open'},ensure_ascii=False,indent=2)+'\n')
          subprocess.run([sys.executable,'tools/check_repository_docs.py'],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          PY
      - name: Commit and non-force push theory and all observed evidence
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git diff --exit-code -- '02_模拟程序'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json, pathlib, subprocess
          names = set(json.loads(pathlib.Path('/tmp/theory13-payload-paths.json').read_text()))
          rec = pathlib.Path('03_研究记录/维护/2026-09-05_辨识摩擦与湿截面理论修订')
          names.update(p.as_posix() for p in rec.rglob('*') if p.is_file() and '__pycache__' not in p.parts)
          assert pathlib.Path('00_项目管理/交接说明_history.md').stat().st_size == 0
          subprocess.run(['git','add','-f','--',*sorted(names)],check=True)
          PY
          git diff --cached --check
          git commit -m 'theory: correct wake identifiability and add stick-slip and directional-wet drag branches'
          git push origin HEAD:main
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theory13-verification-evidence
          path: |
            03_研究记录/维护/2026-09-05_辨识摩擦与湿截面理论修订/
            01_最终理论/
            00_项目管理/交接说明_current.md
            README.md
          retention-days: 7
